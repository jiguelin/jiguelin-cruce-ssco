name: Actualizar padrón SSCO y relación art. 12

on:
  schedule:
    - cron: "17 14 1-5 * *"   # días 1 al 5 de cada mes (SUNAT publica a fin de mes)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/actualizar_padron.py
      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sujesincapacidadOperativa.xlsx data/relacion-ssco.xlsx
          git diff --cached --quiet || (git commit -m "Actualiza listas SSCO $(date +%Y-%m-%d)" && git push)
